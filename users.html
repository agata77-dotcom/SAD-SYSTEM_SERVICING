<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - ICT Service Request System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-container { width: 90%; max-width: 1300px; margin: 30px auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 25px; }
        .card h2 { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #e5e7eb; text-align: left; font-size: 14px; }
        th { background: #f9fafb; }
        .btn-delete { background: #ef4444; color: white; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>

    <header class="topbar">
        <div>
            <h1>User Management</h1>
            <p>Manage system users and their roles.</p>
        </div>
        <a href="index.html">← Dashboard</a>
    </header>

    <main class="page-container">

        <div class="card">
            <h2>Users</h2>
            <p>Administrator access only. Roles determine access permissions.</p>
        </div>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable">
                        <tr><td colspan="4">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script type="module">
        import { requireRole } from "./js/auth.js";
        import { supabase } from "./js/supabase.js";

        const profile = await requireRole(["Administrator"]);

        if (profile) {
            await loadUsers();
        }

        async function loadUsers() {
            const table = document.getElementById("usersTable");
            const { data, error } = await supabase.from("profiles").select("*");

            if (error || !data) {
                table.innerHTML = `<tr><td colspan="4">Unable to load users.</td></tr>`;
                return;
            }

            if (data.length === 0) {
                table.innerHTML = `<tr><td colspan="4">No users found.</td></tr>`;
                return;
            }

            table.innerHTML = "";
            data.forEach(user => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${user.full_name || "N/A"}</td>
                    <td>${user.email || "N/A"}</td>
                    <td><strong>${user.role || "N/A"}</strong></td>
                    <td>
                        <button class="btn-delete" onclick="deleteUser('${user.id}')" title="Delete user">🗑️ Delete</button>
                    </td>
                `;
                table.appendChild(row);
            });
        }

        window.deleteUser = async function(userId) {
            if (!confirm("Are you sure you want to delete this user?")) return;
            const { error } = await supabase.from("profiles").delete().eq("id", userId);
            if (error) {
                alert("Error: " + error.message);
            } else {
                alert("User deleted.");
                await loadUsers();
            }
        };
    </script>

</body>
</html>
