<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request History - ICT Service Request System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-container { width: 90%; max-width: 1300px; margin: 30px auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 25px; }
        .card h2 { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #e5e7eb; text-align: left; font-size: 14px; }
        th { background: #f9fafb; }
        .status-badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .status-Pending { background: #fef3c7; color: #92400e; }
        .status-Approved { background: #d1fae5; color: #065f46; }
        .status-Rejected { background: #fee2e2; color: #991b1b; }
        .status-Released { background: #dbeafe; color: #1e40af; }
        .status-Returned { background: #e0e7ff; color: #3730a3; }
        .status-Overdue { background: #fecaca; color: #7f1d1d; }
        .status-Closed { background: #d1d5db; color: #374151; }
    </style>
</head>
<body>

    <header class="topbar">
        <div>
            <h1>Request History</h1>
            <p>View your previous service requests.</p>
        </div>
        <a href="index.html">← Dashboard</a>
    </header>

    <main class="page-container">

        <div class="card">
            <h2>My Request History</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Date Submitted</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable">
                        <tr><td colspan="5">Loading request history...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card" id="borrowingHistorySection">
            <h2>Borrowing History</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Request ID</th>
                            <th>Equipment</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Reason</th>
                        </tr>
                    </thead>
                    <tbody id="borrowingHistoryTable">
                        <tr><td colspan="5">Loading borrowing history...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script type="module">
        import { requireRole } from "./js/auth.js";
        import { supabase } from "./js/supabase.js";

        const profile = await requireRole(["Requester", "Viewer"]);

        if (profile) {
            loadServiceHistory();
            loadBorrowingHistory();
        }

        async function loadServiceHistory() {
            const table = document.getElementById("historyTable");

            const { data, error } = await supabase
                .from("service_requests")
                .select("*")
                .eq("user_id", profile.authUser.id)
                .order("created_at", { ascending: false });

            if (error || !data || data.length === 0) {
                table.innerHTML = `<tr><td colspan="5">${error ? "Unable to load." : "No service request history found."}</td></tr>`;
                return;
            }

            table.innerHTML = "";
            data.forEach(request => {
                const row = document.createElement("tr");
                const date = request.created_at ? new Date(request.created_at).toLocaleDateString() : "N/A";
                row.innerHTML = `
                    <td>${request.category || "N/A"}</td>
                    <td>${request.description || "N/A"}</td>
                    <td>${request.priority || "N/A"}</td>
                    <td>${request.status || "Pending"}</td>
                    <td>${date}</td>
                `;
                table.appendChild(row);
            });
        }

        async function loadBorrowingHistory() {
            const table = document.getElementById("borrowingHistoryTable");

            const { data, error } = await supabase
                .from("borrowing_requests")
                .select("*, equipment:equipment_id(equipment_id, name)")
                .eq("user_id", profile.authUser.id)
                .order("created_at", { ascending: false });

            if (error || !data) {
                table.innerHTML = `<tr><td colspan="5">Unable to load borrowing history.</td></tr>`;
                return;
            }

            if (data.length === 0) {
                table.innerHTML = `<tr><td colspan="5">No borrowing history.</td></tr>`;
                return;
            }

            table.innerHTML = "";
            data.forEach(req => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${req.request_id || req.id}</td>
                    <td>${req.equipment?.equipment_id || "N/A"}</td>
                    <td>${req.request_date ? new Date(req.request_date).toLocaleDateString() : "N/A"}</td>
                    <td><span class="status-badge status-${req.status}">${req.status}</span></td>
                    <td>${req.reason || "-"}</td>
                `;
                table.appendChild(row);
            });
        }
    </script>

</body>
</html>
