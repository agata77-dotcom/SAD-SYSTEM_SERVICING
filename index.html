<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ICT Service Request System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="nav-brand">
            ICT Service Request System
        </div>

        <button id="logoutBtn" class="btn-logout">
            Logout
        </button>

    </nav>


    <main class="container">

        <!-- Dashboard -->
        <section class="dashboard">

            <h1>Dashboard</h1>

            <div class="dashboard-cards">

                <div class="dashboard-card">
                    <h3>Total Requests</h3>
                    <p id="totalRequests">0</p>
                </div>

                <div class="dashboard-card">
                    <h3>Pending</h3>
                    <p id="pendingRequests">0</p>
                </div>

                <div class="dashboard-card">
                    <h3>In Progress</h3>
                    <p id="inProgressRequests">0</p>
                </div>

                <div class="dashboard-card">
                    <h3>Completed</h3>
                    <p id="completedRequests">0</p>
                </div>

            </div>

        </section>


        <!-- New Request -->
        <section class="request-section">

            <div class="section-header">
                <h2>Service Requests</h2>

                <button id="newRequestBtn" class="btn-primary">
                    + New Request
                </button>
            </div>


            <!-- Search and Filters -->
            <div class="filters">

                <div class="search-box">
                    <label for="searchInput">Search</label>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search requester or description..."
                    >
                </div>


                <div class="filter-group">
                    <label for="statusFilter">Status</label>

                    <select id="statusFilter">
                        <option value="">All</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>


                <div class="filter-group">
                    <label for="priorityFilter">Priority</label>

                    <select id="priorityFilter">
                        <option value="">All</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

            </div>


            <!-- Request Table -->
            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Requester</th>
                            <th>Department</th>
                            <th>Category</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Date Requested</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="requestTableBody">

                        <!-- Requests will be loaded here -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Request Modal -->
    <div id="requestModal" class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    New Service Request
                </h2>

                <button id="closeModalBtn" class="close-btn">
                    &times;
                </button>

            </div>


            <form id="requestForm">

                <input type="hidden" id="requestId">


                <div class="form-group">

                    <label for="requesterName">
                        Requester Name
                    </label>

                    <input
                        type="text"
                        id="requesterName"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Computer Repair">
                            Computer Repair
                        </option>

                        <option value="Software Installation">
                            Software Installation
                        </option>

                        <option value="Network Problem">
                            Internet/Network Problem
                        </option>

                        <option value="Printer Problem">
                            Printer Problem
                        </option>

                        <option value="Account/Access Concern">
                            Account/Access Concern
                        </option>

                        <option value="Other">
                            Other ICT Concern
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="4"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="priority">
                        Priority
                    </label>

                    <select id="priority" required>

                        <option value="">
                            Select Priority
                        </option>

                        <option value="Low">
                            Low
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="High">
                            High
                        </option>

                    </select>

                </div>


                <div class="form-group" id="statusGroup">

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="In Progress">
                            In Progress
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                    </select>

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        id="cancelBtn"
                        class="btn-secondary"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Save Request
                    </button>

                </div>

                <p id="requestMessage" class="message"></p>

            </form>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>  
    <script src="js/app.js"></script>
</body>
</html>
