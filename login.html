<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ICT Service Request System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body.login-page { background: #1f2937; }
        .login-card h1 { color: #1f2937; }
    </style>
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-card">
            <h1>ICT Service Request</h1>
            <p class="login-subtitle">Management System - Lab Asset & Approval Workflow</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
                <p id="loginMessage" class="message"></p>
            </form>

            <div style="margin-top: 20px; padding: 15px; background: #f9fafb; border-radius: 8px; font-size: 13px;">
                <p><strong>Demo Accounts (via Supabase Auth):</strong></p>
                <p>Admin: admin@ict.local / admin123</p>
                <p>Staff: staff@ict.local / staff123</p>
                <p>Requester: requester@ict.local / req123</p>
                <p style="color: #666; margin-top: 8px;">Register via Supabase Auth UI or add users via SQL.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('loginMessage');

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                msg.textContent = error.message;
                msg.style.color = 'red';
            } else {
                msg.textContent = 'Login successful! Redirecting...';
                msg.style.color = 'green';
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            }
        });
    </script>

</body>
</html>
