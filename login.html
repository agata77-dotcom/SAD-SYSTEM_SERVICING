<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ICT Service Request System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body.login-page { background: #1f2937; }
        .login-card h1 { color: #1f2937; }
    </style>
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-card">
            <h1>ICT Service Request</h1>
            <p class="login-subtitle">Management System - Lab Asset & Approval Workflow</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
                <p id="loginMessage" class="message"></p>
            </form>

            <div style="margin-top: 20px; padding: 15px; background: #fef9c3; border-radius: 8px; font-size: 13px; border: 1px solid #fbbf24;">
                <p style="font-weight: bold; margin-bottom: 8px;">No Pre-Configured Accounts</p>
                <p style="color: #333;">Create accounts via Supabase Auth first.</p>
                <p style="margin-top: 6px; color: #666;">See SETUP.md for instructions.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabase } from './js/supabase.js';

        // Check if already logged in (without redirect loop)
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
            window.location.href = 'index.html';
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('loginMessage');

            msg.style.color = '#666';
            msg.textContent = 'Logging in...';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });

                if (error) {
                    msg.style.color = 'red';
                    msg.textContent = 'Login failed: ' + error.message;
                    return;
                }

                if (data && data.user) {
                    msg.style.color = 'green';
                    msg.textContent = 'Login successful! Redirecting...';
                    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                }
            } catch (err) {
                msg.style.color = 'red';
                msg.textContent = 'Unexpected error: ' + err.message;
            }
        });
    </script>

</body>
</html>
